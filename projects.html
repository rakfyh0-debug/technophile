<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projets - technophile</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .app-layout { display: flex; min-height: 100vh; }
    .app-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .app-topbar {
      height: 48px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; background: var(--bg-1); flex-shrink: 0;
    }
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-lo); }
    .app-center { flex: 1; overflow-y: auto; padding: 32px 40px; }
    .page-wrap { max-width: 960px; margin: 0 auto; }

    .proj-toolbar { display: flex; align-items: center; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
    .proj-toolbar .spacer { flex: 1; }

    .proj-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .proj-card-full {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .proj-card-full h4 { font-size: 14px; font-weight: 700; }
    .proj-card-full p { font-size: 12.5px; color: var(--text-lo); line-height: 1.4; flex: 1; }
    .proj-card-full .row { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
    .proj-card-full .del-btn {
      background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px;
    }
    .proj-card-full .del-btn:hover { color: var(--danger); }

    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--text-lo); font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <div class="rail"></div>

    <div class="app-main">
      <header class="app-topbar" data-title="Projets"></header>

      <main class="app-center">
        <div class="page-wrap">
          <h1 style="font-size:22px;font-weight:600;">Projets</h1>
          <p style="font-size:13px;color:var(--text-lo);">Tous tes projets, stockés en local sur cette machine.</p>

          <div class="proj-toolbar">
            <input type="text" id="proj-search" placeholder="Rechercher un projet..." style="max-width:220px;">
            <select id="proj-filter" class="select">
              <option value="">Tous les niveaux</option>
              <option value="débutant">Débutant</option>
              <option value="intermédiaire">Intermédiaire</option>
              <option value="avancé">Avancé</option>
            </select>
            <button type="button" class="sort" id="proj-sort">↕ Plus récent</button>
            <div class="spacer"></div>
            <button type="button" class="btn btn-primary" id="new-project-btn">+ Nouveau projet</button>
          </div>

          <div class="card" id="new-project-form" style="display:none; margin-bottom:20px;">
            <div class="card-title">Nouveau projet</div>
            <div class="form-group">
              <label>Titre</label>
              <input type="text" id="np-title" placeholder="ex: Scraper de prix">
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea id="np-desc" rows="2" placeholder="En quoi consiste le projet ?"></textarea>
            </div>
            <div class="form-group">
              <label>Niveau</label>
              <select id="np-level" class="select" style="width:100%;">
                <option value="débutant">Débutant</option>
                <option value="intermédiaire" selected>Intermédiaire</option>
                <option value="avancé">Avancé</option>
              </select>
            </div>
            <div style="display:flex;justify-content:flex-end;gap:10px;">
              <button type="button" class="btn btn-outline" id="np-cancel">Annuler</button>
              <button type="button" class="btn btn-primary" id="np-create">Créer</button>
            </div>
          </div>

          <div class="proj-grid" id="proj-grid"></div>
          <div class="empty-state" id="proj-empty" style="display:none;">Aucun projet ne correspond à ta recherche.</div>
        </div>
      </main>
    </div>
  </div>

<script>
    seedProjectsIfEmpty();

    const grid = document.getElementById('proj-grid');
    const emptyState = document.getElementById('proj-empty');
    const searchInput = document.getElementById('proj-search');
    const filterSelect = document.getElementById('proj-filter');
    const sortBtn = document.getElementById('proj-sort');
    let sortRecent = true;

    function render() {
      let list = getProjects();

      const q = searchInput.value.trim().toLowerCase();
      const level = filterSelect.value;

      list = list.filter(p =>
        (!q || p.title.toLowerCase().includes(q) || p.description.toLowerCase().includes(q)) &&
        (!level || p.level === level)
      );

      list.sort((a, b) => sortRecent ? b.createdAt - a.createdAt : a.createdAt - b.createdAt);

      grid.innerHTML = '';
      emptyState.style.display = list.length ? 'none' : 'block';

      list.forEach(p => {
        const card = document.createElement('div');
        card.className = 'proj-card-full';
        card.innerHTML = `
          <h4>${p.title}</h4>
          <p>${p.description}</p>
          <div class="row">
            <span class="status-tag">Niveau ${p.level}</span>
            <button type="button" class="del-btn" data-id="${p.id}">Supprimer</button>
          </div>
        `;
        card.querySelector('.del-btn').addEventListener('click', () => {
          const all = getProjects().filter(x => x.id !== p.id);
          saveProjects(all);
          render();
          showToast('Projet supprimé');
        });
        grid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', render);
    filterSelect.addEventListener('change', render);
    sortBtn.addEventListener('click', () => {
      sortRecent = !sortRecent;
      sortBtn.textContent = sortRecent ? '↕ Plus récent' : '↕ Plus ancien';
      render();
    });

    const form = document.getElementById('new-project-form');
    document.getElementById('new-project-btn').addEventListener('click', () => {
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    });
    document.getElementById('np-cancel').addEventListener('click', () => {
      form.style.display = 'none';
    });
    document.getElementById('np-create').addEventListener('click', () => {
      const title = document.getElementById('np-title').value.trim();
      const description = document.getElementById('np-desc').value.trim();
      const level = document.getElementById('np-level').value;

      if (!title) {
        showToast('Donne un titre au projet');
        return;
      }

      const all = getProjects();
      all.push({ id: uid(), title, description: description || 'Pas de description.', level, createdAt: Date.now() });
      saveProjects(all);

      document.getElementById('np-title').value = '';
      document.getElementById('np-desc').value = '';
      form.style.display = 'none';
      render();
      showToast('Projet créé');
    });

    render();
  </script>
<script src="supabase-js.min.js"></script>
<script src="supabase-config.js"></script>
<script src="script.js"></script>
<script src="app.js"></script>
<script src="partials.js"></script>
</body>
</html>
