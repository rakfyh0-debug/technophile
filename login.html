<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - technophile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 7 9 12 4 17"/>
        <line x1="13" y1="17" x2="20" y2="17"/>
      </svg>
    </div>

    <h1 class="auth-title">Bon retour !</h1>
    <p class="auth-subtitle">Connectez-vous à votre compte.</p>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Adresse email</label>
        <input type="email" id="email" placeholder="vous@exemple.com" required>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full">Se connecter</button>
    </form>

    <p class="auth-footer">
      Pas encore de compte ? <a href="signup.html">Créer un compte</a>
    </p>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showToast('Email et mot de passe sont requis');
        return;
      }

      const client = typeof initSupabase === 'function' ? initSupabase() : null;
      if (!client) {
        showToast('Supabase indisponible');
        return;
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Connexion...';

      const { data, error } = await client.auth.signInWithPassword({ email, password });

      if (error) {
        console.error('signIn error:', error);
        showToast('Erreur : ' + error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Se connecter';
        return;
      }

      // Sync localStorage pour le reste de l'app
      const { data: profile } = await client
        .from('profiles')
        .select('*')
        .eq('id', data.user.id)
        .single();

      localStorage.setItem('technophile_user', JSON.stringify({
        id: data.user.id,
        email: data.user.email,
        username: profile?.username || data.user.email.split('@')[0],
        bio: profile?.bio || '',
        avatar: profile?.avatar_animal ? {
          animal: profile.avatar_animal,
          gradient: profile.avatar_gradient
        } : null,
        createdAt: Date.now()
      }));

      showToast('Connecté !');
      setTimeout(() => { window.location.href = 'index.html'; }, 400);
    });
  </script>

<script src="supabase-js.min.js"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
<script src="partials.js"></script>
</body>
</html>
